<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="مقالاتُ حيدر المعاتيق: مساءلاتٌ في الأدبِ والثقافة، ومساحاتٌ في التدريبِ والتعليم.">
<meta name="theme-color" content="#0A3428">
<meta property="og:type" content="website">
<meta property="og:title" content="المقالات — حيدر المعاتيق">

<link rel="preload" href="fonts/sakkal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/poster-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/articles.css">
<script>document.documentElement.className+=' js';</script>

<body>

<div class="progress" aria-hidden="true"><i></i></div>

<header class="head">
  <img class="watermark" src="img/logo-cream.svg" alt="" aria-hidden="true">
  <div class="wrap">
    <div class="bar">
      <img class="mark" src="img/logo-cream.svg" alt="شعار حيدر" data-in style="--d:40ms;--in-y:-10px">
      <a class="home" href="https://haydarvsky.github.io/" data-in style="--d:120ms;--in-y:-10px">
        الصفحةُ الرئيسة
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
      </a>
    </div>

    <h1 data-in style="--d:220ms">المقالات</h1>
    <p class="sub" data-in style="--d:320ms">مساءلاتٌ في الأدبِ والثقافة، ومساحاتٌ في التدريبِ والتعليم.</p>
    <div class="rule"></div>

    <div class="tools" data-in style="--d:420ms">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="ابحثْ في المقالات…" aria-label="ابحث في المقالات" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="تصفيةٌ بالتصنيف"></div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="count" id="count" aria-live="polite"></div>
    <div id="feat"></div>
    <div class="list" id="list"></div>
    <div id="empty" hidden>
      <div class="empty">
        <b>لا مقالةَ بهذا الوصف</b>
        لم يُطابقْ بحثَك شيءٌ من المقالات المنشورة.
        <br><button type="button" id="reset">أعِدْ إظهارَ الكلّ</button>
      </div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <a class="back" href="https://haydarvsky.github.io/">
      الصفحةُ الرئيسة
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
    </a>
    <img class="mark" src="img/logo-cream.svg" alt="شعار حيدر">
    <div class="sig">حيدر المعاتيق — أبو إيليا</div>
    <div class="copy">جميعُ الحقوق محفوظة — ٢٠٢٦</div>
  </div>
</footer>

<script src="js/articles.js"></script>
